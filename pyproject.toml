[build-system]
requires = ["uv-build>=0.10.12,<0.12.0"]
build-backend = "uv_build"


[project]
name = "pymetallum"
version = "0.5.5"
authors = [
  { name = "Gabriel Jung", email = "gabriel.jung@protonmail.com" },
]
description = "An interactive CLI and Python library for browsing Metal Archives from the terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["metal", "metal-archives", "cli", "tui", "music", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.14.0",
    "loguru>=0.7.3",
    "rich-metadata>=0.1.8",
]


[project.optional-dependencies]
discord = [
    "discord.py>=2.7.0",
    "discord-metadata>=0.1.0",
    "python-dotenv>=1.0.0",
]


[project.urls]
Homepage = "https://github.com/gabriel-jung/pymetallum"
Repository = "https://github.com/gabriel-jung/pymetallum"
"Bug Tracker" = "https://github.com/gabriel-jung/pymetallum/issues"


[project.scripts]
metallum = "pymetallum.app.cli:main"
metallum-discord = "pymetallum.app.discord:main"


[tool.pytest.ini_options]
markers = ["live: tests that hit Metal Archives (deselect with '-m not live')"]
addopts = "-m 'not live'"


[tool.ruff]
target-version = "py312"
line-length = 110


[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF022", "B904"]


[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=8.0",
    "ruff>=0.14.3",
    { include-group = "discord" },
]
discord = [
    "discord.py>=2.7.0",
    "discord-metadata>=0.1.0",
    "python-dotenv>=1.0.0",
]
