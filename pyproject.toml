[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymetallum"
version = "0.2.1"
authors = [
  { name = "Gabriel Jung", email = "gabriel.jung@protonmail.com" },
]
description = "An interactive CLI and Python library for browsing Metal Archives from the terminal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "beautifulsoup4",
    "curl-cffi>=0.14.0",
    "loguru>=0.7.3",
    "rich>=14.3.3",
]

[project.urls]
Homepage = "https://github.com/gabriel-jung/pymetallum"
Repository = "https://github.com/gabriel-jung/pymetallum"

[project.scripts]
metallum = "pymetallum.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.14.3",
]
